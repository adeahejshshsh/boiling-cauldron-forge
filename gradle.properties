org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

## 环境属性
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.267
neo_version_range=[21.1.0,)
loader_version_range=[4,)
mapping_channel=official
mapping_version=1.21.1

# 可选兼容：JEI（仅编译期）
jei_version=19.71.0.475
# 可选兼容：Jade（仅编译期）。值是 Modrinth 的 version id，不是版本号。
jade_version=eYz2YBGT

## 模组属性
# 注意：Gradle 以 ISO-8859-1 读取本文件，禁止在此写非 ASCII 字符。
# 中文显示名/作者/简介一律硬编码在 META-INF/neoforge.mods.toml 里。
mod_id=boilingcauldron
mod_license=MIT (code) + CC0-1.0 (assets)
mod_version=1.0.3-neoforge
mod_group_id=com.adeahejshshsh.boilingcauldron
# 仅用于 JAR MANIFEST，必须是纯 ASCII
mod_vendor_ascii=Xkbsx413 and their respected artists, adeahejshshsh
