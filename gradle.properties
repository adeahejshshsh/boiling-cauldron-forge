# 分配给 Gradle 的内存，反编译 Minecraft 需要较大堆
org.gradle.jvmargs=-Xmx3G

## 环境属性

# Minecraft 版本必须与 Forge 版本匹配
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.0
forge_version_range=[47.3.0,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

# 可选兼容：JEI（仅编译期依赖，运行期缺失不影响模组）
jei_version=15.75.0.239
# 可选兼容：Jade（仅编译期）。值是 Modrinth 的 version id，不是版本号。
jade_version=xJQHCmWJ

## 模组属性

# 注意：Gradle 以 ISO-8859-1 读取本文件，禁止在此写非 ASCII 字符。
# 中文显示名/作者/简介一律硬编码在 META-INF/mods.toml 里。
mod_id=boilingcauldron
mod_license=MIT (code) + CC0-1.0 (assets)
mod_version=1.0.3-forge
mod_group_id=com.boilingcauldron
# 仅用于 JAR MANIFEST，必须是纯 ASCII
mod_vendor_ascii=Xkbsx413 and their respected artists, adeahejshshsh
